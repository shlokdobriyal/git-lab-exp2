name: CD for git-lab-exp2

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run tests
        run: echo "Running tests... ✅"

  deploy:
    needs: test        # Runs ONLY after test job passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        run: echo "Deploying shlokdobriyal/git-lab-exp2 to production 🚀"
